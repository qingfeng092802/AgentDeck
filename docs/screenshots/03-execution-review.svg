  <text x="114" y="410" class="ink body">T04 · 商品展示页</text>
  <text x="524" y="410" class="accent body mono" text-anchor="end">64%</text>
  <rect x="76" y="422" width="448" height="3" rx="1.5" fill="#212731"/>
  <rect x="76" y="422" width="286" height="3" rx="1.5" fill="#45D6F0"/>
  <text x="76" y="448" class="muted body">执行器 qoder · 产物目录 qoder-workspace/</text>
  <text x="76" y="466" class="muted body">观察窗内无产出会标“超时”，光环停止呼吸</text>

  <rect x="60" y="490" width="480" height="38" rx="8" fill="#45D6F0" opacity=".10"/>
  <text x="76" y="514" class="accent body">交接包：上游 T03 → 下游 T04 · 产物 1 份 · 门禁 512 B / 12 行</text>

  <rect x="580" y="84" width="580" height="512" rx="12" fill="#0E121A" stroke="#232A36"/>
  <text x="604" y="116" class="ink h2">执行记录</text>
  <text x="720" y="116" class="ok meta">● SSE 已连接</text>
  <rect x="882" y="100" width="80" height="22" rx="6" fill="#181D26" stroke="#2A313C"/>
  <text x="922" y="115" class="muted meta" text-anchor="middle">活动流</text>
  <rect x="970" y="100" width="80" height="22" rx="6" fill="#181D26" stroke="#2A313C"/>
  <text x="1010" y="115" class="muted meta" text-anchor="middle">审查</text>
  <rect x="1058" y="100" width="82" height="22" rx="6" fill="#181D26" stroke="#2A313C"/>
  <text x="1099" y="115" class="muted meta" text-anchor="middle">文件总线</text>
  <line x1="604" y1="132" x2="1136" y2="132" stroke="#232A36"/>

  <g class="body">
    <text x="604" y="162" class="muted mono">14:02:11</text>
    <text x="676" y="162" class="accent">qoder</text>
    <text x="790" y="162" class="ink">T04 开始执行 · 读取交接包</text>
    <text x="1136" y="162" class="muted meta" text-anchor="end">RUNNING</text>
    <line x1="604" y1="174" x2="1136" y2="174" stroke="#1B2431"/>

    <text x="604" y="198" class="muted mono">14:02:18</text>
    <text x="676" y="198" class="accent">qoder</text>
    <text x="790" y="198" class="ink">写入 products.html · 684 B / 18 行</text>
    <text x="1136" y="198" class="ok meta" text-anchor="end">ARTIFACT</text>
    <line x1="604" y1="210" x2="1136" y2="210" stroke="#1B2431"/>

    <text x="604" y="234" class="muted mono">14:02:19</text>
    <text x="676" y="234" class="accent">qoder</text>
    <text x="790" y="234" class="ink">回投结果 · 自评 success（不参与判定）</text>
    <text x="1136" y="234" class="muted meta" text-anchor="end">RESULT</text>
    <line x1="604" y1="246" x2="1136" y2="246" stroke="#1B2431"/>

    <text x="604" y="270" class="muted mono">14:02:20</text>
    <text x="676" y="270" class="warn">gate</text>
    <text x="790" y="270" class="ink">产物门禁：格式 html / 684 B / 18 行</text>
    <text x="1136" y="270" class="ok meta" text-anchor="end">VALID</text>
    <line x1="604" y1="282" x2="1136" y2="282" stroke="#1B2431"/>

    <text x="604" y="306" class="muted mono">14:02:20</text>
    <text x="676" y="306" class="accent">reviewer</text>
    <text x="790" y="306" class="ink">独立审查席开始比对验收标准</text>
    <text x="1136" y="306" class="warn meta" text-anchor="end">REVIEWING</text>
    <line x1="604" y1="318" x2="1136" y2="318" stroke="#1B2431"/>

    <text x="604" y="342" class="muted mono">14:02:31</text>
    <text x="676" y="342" class="danger">reviewer</text>
    <text x="790" y="342" class="danger">REJECT · 第 2 条判据未过 → 打回重做</text>
    <text x="1136" y="342" class="danger meta" text-anchor="end">CHANGES</text>
    <line x1="604" y1="354" x2="1136" y2="354" stroke="#1B2431"/>

    <text x="604" y="378" class="muted mono">14:02:33</text>
    <text x="676" y="378" class="accent">orchestrator</text>
    <text x="790" y="378" class="ink">回派 T04 · 不改执行者 · 轮次 2 / 3</text>
    <text x="1136" y="378" class="muted meta" text-anchor="end">REWORK</text>
  </g>

  <rect x="604" y="400" width="532" height="176" rx="8" fill="#181D26" stroke="#2A313C"/>
  <text x="620" y="424" class="muted meta">REVIEW · 独立审查员</text>
  <text x="1120" y="424" class="danger meta" text-anchor="end">REJECT</text>
  <line x1="620" y1="436" x2="1120" y2="436" stroke="#232A36"/>

  <text x="620" y="460" class="ok body">✓ 页面结构与 PRD 一致</text>
  <text x="620" y="482" class="ok body">✓ 产物文件名必须是 products.html</text>
  <text x="620" y="504" class="danger body">✕ 375px 下导航不得遮挡主内容</text>
  <text x="620" y="526" class="muted body">差在哪：导航固定高度 64px，主内容未让位。</text>
  <text x="620" y="548" class="muted body">建议：首屏加 padding-top，或改为静态导航。</text>

  <rect x="40" y="612" width="1120" height="38" rx="8" fill="#0E121A" stroke="#232A36"/>
  <text x="60" y="636" class="ink h2">执行流与审查</text>
  <text x="204" y="636" class="muted body">交接包 / 产物回投 / 门禁 / 审查循环 / 打回与轮次上限</text>
  <text x="1140" y="636" class="muted meta" text-anchor="end">SCREENSHOT PLACEHOLDER</text>
</svg>

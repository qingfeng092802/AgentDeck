<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="shot-title shot-desc">
  <title id="shot-title">项目工作室 · 立项</title>
  <desc id="shot-desc">截图占位：左侧 12 工位名册，中部受理卡，右侧四席立项会。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B2431" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45D6F0" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#45D6F0" stop-opacity="0"/>
    </linearGradient>
    <style>
      .ink { fill: #E8EDF6; font-family: Inter, "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }
      .muted { fill: #A7B2C6; font-family: Inter, "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }
      .accent { fill: #45D6F0; font-family: Inter, "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }
      .ok { fill: #4FDC9E; font-family: Inter, "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }
      .warn { fill: #EBB964; font-family: Inter, "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
      .h1 { font-size: 26px; font-weight: 700; letter-spacing: .01em; }
      .h2 { font-size: 14px; font-weight: 650; }
      .body { font-size: 12px; }
      .meta { font-size: 10px; letter-spacing: .08em; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#080B11"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="#232A36" stroke-width="2"/>

  <rect width="1200" height="56" fill="#0E121A"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#232A36"/>
  <text x="40" y="35" class="ink h2">◆ AgentDeck</text>
  <rect x="144" y="18" width="64" height="20" rx="6" fill="#181D26" stroke="#2A313C"/>
  <text x="176" y="32" class="muted meta" text-anchor="middle">指挥台</text>
  <text x="218" y="34" class="muted body">项目工作室 <tspan fill="#45D6F0">/</tspan> 立项</text>
  <text x="1160" y="34" class="muted meta" text-anchor="end">01 / 04 · INTAKE</text>

  <rect x="40" y="84" width="224" height="512" rx="12" fill="#0E121A" stroke="#232A36"/>
  <text x="60" y="114" class="muted meta">编制 · 12 SEATS</text>
  <line x1="60" y1="126" x2="244" y2="126" stroke="#232A36"/>

  <rect x="56" y="140" width="192" height="30" rx="8" fill="#181D26" stroke="#2A313C"/>
  <circle cx="74" cy="155" r="4" fill="#45D6F0"/>
  <text x="88" y="159" class="ink body">工作流编排专家</text>
  <text x="232" y="159" class="muted meta" text-anchor="end">总管</text>

  <g class="body">
    <text x="60" y="198" class="ink">需求分析专家</text>
    <circle cx="236" cy="194" r="3" fill="#EBB964"/>
    <text x="60" y="234" class="ink">系统架构专家</text>
    <circle cx="236" cy="230" r="3" fill="#EBB964"/>
    <text x="60" y="270" class="ink">UI/UX 设计师</text>
    <circle cx="236" cy="266" r="3" fill="#A7B2C6"/>
    <text x="60" y="306" class="muted">前端开发专家</text>
    <circle cx="236" cy="302" r="3" fill="#A7B2C6"/>
    <text x="60" y="342" class="muted">后端开发专家</text>
    <circle cx="236" cy="338" r="3" fill="#A7B2C6"/>
    <text x="60" y="378" class="muted">技术文档专家</text>
    <circle cx="236" cy="374" r="3" fill="#A7B2C6"/>
    <text x="60" y="414" class="muted">测试开发专家</text>
    <circle cx="236" cy="410" r="3" fill="#A7B2C6"/>
    <text x="60" y="450" class="muted">应用安全专家</text>
    <circle cx="236" cy="446" r="3" fill="#A7B2C6"/>
    <text x="60" y="486" class="muted">独立代码审查员</text>
    <circle cx="236" cy="482" r="3" fill="#A7B2C6"/>
    <text x="60" y="522" class="muted">交付验收专家</text>
    <circle cx="236" cy="518" r="3" fill="#A7B2C6"/>
    <text x="60" y="558" class="muted">全栈保障专家</text>
    <circle cx="236" cy="554" r="3" fill="#A7B2C6"/>
  </g>

  <rect x="288" y="84" width="520" height="512" rx="12" fill="#0E121A" stroke="#232A36"/>
  <text x="312" y="116" class="ink h2">受理需求</text>
  <text x="412" y="116" class="muted body">客户原话，越口语越好</text>
  <rect x="620" y="100" width="84" height="20" rx="6" fill="#181D26" stroke="#2A313C"/>
  <text x="662" y="114" class="muted meta" text-anchor="middle">自然语言</text>

  <text x="312" y="150" class="muted meta">项目键</text>
  <rect x="312" y="160" width="220" height="28" rx="6" fill="#080B11" stroke="#2A313C"/>
  <text x="324" y="178" class="muted body mono">acp-demo</text>

  <rect x="312" y="204" width="472" height="156" rx="8" fill="#080B11" stroke="#2A313C"/>
  <text x="330" y="234" class="ink body">做一个卖手冲咖啡的静态官网，包含首页、</text>
  <text x="330" y="256" class="ink body">商品展示、联系我们三个页面，</text>
  <text x="330" y="278" class="ink body">并且能在手机上正常查看。</text>
  <text x="330" y="324" class="muted body">提交后真落库、真拆卡；出卡即进看板</text>

  <rect x="312" y="344" width="176" height="34" rx="8" fill="#45D6F0"/>
  <text x="400" y="366" fill="#04121A" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">立项 · 交给后端拆解</text>

  <line x1="312" y1="404" x2="784" y2="404" stroke="#232A36"/>
  <text x="312" y="430" class="muted meta">PIPELINE</text>
  <g class="body">
    <text x="312" y="456" class="accent">01 受理</text>
    <text x="402" y="456" class="muted">→</text>
    <text x="424" y="456" class="ink">02 立项会</text>
    <text x="520" y="456" class="muted">→</text>
    <text x="542" y="456" class="ink">03 产出</text>
    <text x="622" y="456" class="muted">→</text>
    <text x="644" y="456" class="ink">04 拆卡</text>
  </g>
  <text x="312" y="486" class="muted body">四岗位会议 · 默认 2 轮 · 技术总监必须点名风险</text>
  <text x="312" y="510" class="muted body">PRD / 架构 / 令牌三份文档与卡同批产出</text>

  <rect x="300" y="532" width="76" height="22" rx="6" fill="#181D26" stroke="#2A313C"/>
  <text x="338" y="547" class="muted meta" text-anchor="middle">占位</text>
  <text x="392" y="547" class="muted body">截图位置 · 实拍后替换</text>

  <rect x="832" y="84" width="328" height="512" rx="12" fill="#0E121A" stroke="#232A36"/>
  <text x="856" y="116" class="ink h2">立项会 · 4 岗</text>
  <text x="1136" y="116" class="muted meta" text-anchor="end">ROUND 1 / 2</text>
  <line x1="856" y1="130" x2="1136" y2="130" stroke="#232A36"/>

  <g>
    <circle cx="872" cy="160" r="10" fill="#45D6F0" opacity=".18"/>
    <text x="872" y="164" class="accent meta" text-anchor="middle">总</text>
    <text x="894" y="158" class="ink body">工作室总管</text>
    <text x="894" y="174" class="muted body">先复述最关键的一句，点名下一轮。</text>
    <text x="1130" y="160" class="muted meta" text-anchor="end">00:12</text>

    <circle cx="872" cy="232" r="10" fill="#B49BFF" opacity=".18"/>
    <text x="872" y="236" fill="#B49BFF" font-size="10" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">产</text>
    <text x="894" y="230" class="ink body">产品经理</text>
    <text x="894" y="246" class="muted body">三个页面，每页职责与可验收判据。</text>
    <text x="1130" y="232" class="muted meta" text-anchor="end">00:19</text>

    <circle cx="872" cy="304" r="10" fill="#EBB964" opacity=".18"/>
    <text x="872" y="308" class="warn" font-size="10" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">技</text>
    <text x="894" y="302" class="ink body">技术总监</text>
    <text x="894" y="318" class="muted body">先点名方案里最脆的一环，再给选型。</text>
    <text x="1130" y="304" class="muted meta" text-anchor="end">00:17</text>

    <circle cx="872" cy="376" r="10" fill="#4FDC9E" opacity=".18"/>
    <text x="872" y="380" class="ok" font-size="10" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">设</text>
    <text x="894" y="374" class="ink body">UI 设计师</text>
    <text x="894" y="390" class="muted body">接住选型约束，给主色与版式决定。</text>
    <text x="1130" y="376" class="muted meta" text-anchor="end">00:15</text>
  </g>

  <line x1="856" y1="414" x2="1136" y2="414" stroke="#232A36"/>
  <text x="856" y="442" class="muted meta">OUTPUT</text>
  <g class="body">
    <text x="856" y="468" class="ink">PRD</text>
    <text x="1130" y="468" class="ok" text-anchor="end">已定稿</text>
    <text x="856" y="492" class="ink">架构</text>
    <text x="1130" y="492" class="ok" text-anchor="end">已定稿</text>
    <text x="856" y="516" class="ink">令牌</text>
    <text x="1130" y="516" class="muted" text-anchor="end">待生成</text>
  </g>

  <rect x="40" y="612" width="1120" height="38" rx="8" fill="#0E121A" stroke="#232A36"/>
  <text x="60" y="636" class="ink h2">项目工作室 · 立项</text>
  <text x="240" y="636" class="muted body">一句话需求 / 四岗位会议 / PRD · 架构 · 令牌</text>
  <text x="1140" y="636" class="muted meta" text-anchor="end">SCREENSHOT PLACEHOLDER</text>
</svg>

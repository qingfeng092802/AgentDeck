  <text x="320" y="318" class="ink body mono" text-anchor="end">REQ-20261029-01</text>
  <text x="60" y="344" class="muted meta">VERSION</text>
  <text x="320" y="344" class="ink body mono" text-anchor="end">v1</text>
  <text x="60" y="370" class="muted meta">SIGNED BY</text>
  <text x="320" y="370" class="ink body" text-anchor="end">acceptor</text>
  <text x="60" y="396" class="muted meta">ENTRY</text>
  <text x="320" y="396" class="ink body mono" text-anchor="end">index.html</text>

  <rect x="60" y="424" width="260" height="40" rx="8" fill="#45D6F0"/>

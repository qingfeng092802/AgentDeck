  <text x="180" y="636" class="muted body">验收签字 / 可下载 zip / 当场预览 / 文件清单与阻断原因</text>
  <text x="1140" y="636" class="muted meta" text-anchor="end">SCREENSHOT PLACEHOLDER</text>
</svg>

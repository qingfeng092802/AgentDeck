  <text x="414" y="252" fill="#5E554A" font-size="11" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">从豆子到杯子，只做当季。</text>
  <rect x="414" y="268" width="86" height="28" rx="6" fill="#0B5F66"/>

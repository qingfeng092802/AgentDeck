  <rect x="690" y="330" width="108" height="52" rx="6" fill="#E6DFD2"/>
  <text x="698" y="402" fill="#221C14" font-size="11" font-weight="650" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">肯尼亚</text>
  <text x="698" y="418" fill="#5E554A" font-size="9" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">日晒 · 中浅烘</text>

  <rect x="414" y="456" width="392" height="76" rx="8" fill="#EDE7DC"/>
  <text x="430" y="480" fill="#221C14" font-size="11" font-weight="650" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">联系我们</text>
  <text x="430" y="498" fill="#5E554A" font-size="9" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">hello@example.com · 周一至周五 10:00–18:00</text>
  <text x="430" y="516" fill="#5E554A" font-size="9" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">门店地址 · 城市 / 街道 00 号</text>


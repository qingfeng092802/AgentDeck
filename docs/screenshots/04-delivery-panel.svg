  <line x1="384" y1="130" x2="836" y2="130" stroke="#232A36"/>

  <rect x="384" y="150" width="452" height="410" rx="8" fill="#FCFAF4" stroke="#D8D0C1"/>
  <rect x="384" y="150" width="452" height="34" rx="8" fill="#F2EDE4"/>
  <circle cx="404" cy="167" r="4" fill="#A32A1E"/>
  <circle cx="418" cy="167" r="4" fill="#8A4A05"/>
  <circle cx="432" cy="167" r="4" fill="#14663F"/>
  <rect x="452" y="158" width="260" height="18" rx="4" fill="#FCFAF4" stroke="#D8D0C1"/>

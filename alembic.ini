[alembic]
# Migration script dir (T023): kept next to the models under `src/acp/persistence/`
# so there is only one place to look (not "config at root, models in src").
#
# Comments in this file are ASCII on purpose (owner 2026-10-14, P2-1):
# alembic reads it via `ConfigParser.read(..., encoding="locale")`
# (alembic/util/compat.py:130), so non-ASCII comments raise UnicodeDecodeError
# whenever the process locale is cp936 / cp1252. Measured before this change:
# cp936 -> illegal multibyte sequence at byte 0xae; cp1252 -> undefined byte 0x81;
# cp437 / utf-8 -> OK. Config keys below are unchanged.
script_location = src/acp/persistence/migrations
prepend_sys_path = src
version_path_separator = os

# **Deliberately no `sqlalchemy.url` here**: credentials come from the environment
# variable `ACP_DB_DSN` only, read by `migrations/env.py`. Putting a DSN in this file
# would commit a password into a version-controlled file (constitution section 2).
# No `[loggers]` section either: once migration logging is on, the connection string
# has a path into log files. This round does not need it.

# 低风险自动验收：**哪些任务类型允许机器代签**（FR-046 的第四处扩展，2026-10-28）。
#
# 为什么这份清单必须是一个文件、而不是代码里的一个集合：
# 它决定"什么人不用被叫来签字"。写进代码 = 改它要发版；写进文件 = 改它要过一次 code review
# 但不用发版。两种摩擦都比"藏在某个 if 里"强。口径同 `risk_matrix.yaml`：
# **代码里没有任何兜底规则**，读不出这份文件就报错，不"当没命中"。
#
# 判据只认后缀（`task_card.artifact_floor_format`，平台侧算出来的事实），**不认标题、不认 AI 判断**
# —— FR-047 那句"MUST NOT 由 AI 自由裁量"在这一格上的落点就是：这里没有"模型觉得低风险"这种输入。
#
# 为什么只有这两种：
# - `md` 文档生成：产物是给人读的说明/PRD/README，不进运行时，没有副作用；
# - `css` 纯样式：只影响观感，改错了看得见、回滚是一行 diff。
# 为什么**不含** `html`：一张 html 里可以有表单、外链、内嵌脚本，"静态页"与"没有副作用"不是一回事
# （2026-10-28 的事故就是一张表单页要去写库）。`py` 会执行、`json` 可能是配置，都不进这一档。
# 要放宽到 html 请先回答一句：这份 html 提交上去之后，谁会被它影响？答不上来就别放宽。
version: 1
low_risk_formats:
  - md
  - css
